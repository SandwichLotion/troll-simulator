name = "troll-simulator-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Your site origin(s), comma-separated, no trailing slash or path
ALLOWED_ORIGIN = "https://YOUR-USERNAME.github.io"
# Exact URL of the game page. Register this same value as a Web redirect URI in the TikTok developer portal.
REDIRECT_URI = "https://YOUR-USERNAME.github.io/troll-simulator/"
# Public client key from the TikTok developer portal
TIKTOK_CLIENT_KEY = "YOUR_TIKTOK_CLIENT_KEY"

# Secrets (never put these in this file). Set them with:
#   npx wrangler secret put TIKTOK_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET      (any long random string, e.g. from: openssl rand -base64 32)
